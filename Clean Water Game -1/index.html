<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Water Filter Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-container">
      <h1>💧 Water Filter Game</h1>

      <p class="instructions">
        Click the clean water drops to earn points. Avoid germs and never click trash.
      </p>

      <div class="game-info">
        <div class="info-box">
          <h3>Score</h3>
          <p id="score">0</p>
        </div>

        <div class="info-box">
          <h3>Time</h3>
          <p id="timer">30</p>
        </div>

        <div class="info-box">
          <h3>Goal</h3>
          <p id="goal">300</p>
        </div>
      </div>

      <div class="progress-container">
        <div class="progress-label">Water Level</div>
        <div class="progress-background">
          <div id="water-progress"></div>
        </div>
      </div>

      <button id="start-button" class="action-button">Start Game</button>

      <div id="game-area" aria-label="Water game area"></div>

      <div id="message" class="message" aria-live="polite"></div>

      <button id="play-again" class="action-button hidden">Play Again</button>
    </div>

    <div id="winScreen" class="win-screen" aria-live="assertive">
      <div class="win-message">
        <div class="water-drop">💧</div>
        <h2>You Win! 🎉</h2>
        <p>Great job! You helped make the water clean!</p>
        <button id="restart-button" class="action-button">Play Again</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
